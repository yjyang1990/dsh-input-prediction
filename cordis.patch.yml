- insert:
    - id: dsh-input-prediction
      name: 'dsh-input-prediction'
      config:
        # Same switch as Codex's composer-predictions-enabled (default on).
        enabled: true
        # Provider + model for predictions; empty = the session's own route.
        # A model without provider uses the session provider, else the only provider offering it.
        predictionProvider: ''
        predictionModel: ''
        # Optional effort id; empty = the model's lowest advertised effort.
        reasoningEffort: ''
        maxTokens: 160
        timeoutMs: 30000
